<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Swaad-e-Mehfil</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #fbf7f0;
        color: #231f20;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.5rem;
        margin: 1rem 0 0.5rem;
        color: #7a2e2e;
      }
      p {
        color: #6b6360;
        font-size: 0.95rem;
        max-width: 26rem;
      }
      button {
        margin-top: 1.5rem;
        height: 2.75rem;
        padding: 0 1.5rem;
        border-radius: 0.625rem;
        background: #7a2e2e;
        color: #fff8f0;
        font-size: 0.9rem;
        font-weight: 600;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>
      Swaad-e-Mehfil needs an internet connection to load the menu, place orders, and manage
      reservations. Please check your connection and try again.
    </p>
    <button onclick="location.reload()">Try Again</button>
  </body>
</html>
